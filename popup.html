<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TurboText WA</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <h2>TurboText WA - Multi Sender</h2>

    <label>Targets (One per line)</label>
    <div style="font-size: 11px; color: #555; margin-bottom: 5px;">
      1. International Numbers (e.g. 919876543210)<br>
      2. Exact Group Names (Case sensitive)
    </div>
    <textarea id="targets"
placeholder="Example:
919876543210
My Family Group
919812345678"
rows="6"></textarea>


    <label>Message</label>
    <textarea id="message" placeholder="Write your message..." rows="4"></textarea>

    <div class="row">
      <label for="delay">Delay (seconds):</label>
      <input id="delay" type="number" min="0" value="6" />
    </div>

    <div class="row">
      <button id="sendBtn">Send</button>
      <button id="clearBtn">Clear</button>
    </div>

    <div id="status" class="status"></div>

    <div class="footer">
      <small>Keep WhatsApp Web open. Do not switch tabs while sending.</small>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
